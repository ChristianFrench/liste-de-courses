<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Courses par secteur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#222222}a:hover{color:#000000}
.hd{height:48px;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:2px solid #222222;flex:none}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none}
.pause{display:flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border:2px solid #222222;border-radius:18px;font-size:13px;font-weight:700;text-decoration:none;margin-right:4px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 8px;white-space:nowrap;border-bottom:1px solid #CCCCCC;flex:none}
.chip{display:flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border:2px solid #222222;border-radius:6px;font-size:13px;background:#FFFFFF;font-family:inherit;color:#222222;flex:none}
.chip.sel{background:#222222;color:#FFFFFF;font-weight:700}
.chip.done{color:#777777;border-color:#999999}
.row{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid #DDDDDD;padding:0 8px}
.row input{width:28px;height:28px;margin:0;accent-color:#222222;flex:none}
.nm{flex:1;min-width:0;font-size:17px}
.s{font-size:12px;color:#555555}
.q{font-size:17px;font-weight:700;flex:none}
.pi{min-width:24px;height:18px;padding:0 3px;border:1.5px solid #222222;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 12px;border:2px solid #222222;border-radius:8px;font-weight:700;text-decoration:none;background:#FFFFFF;color:#222222;font-size:15px}
.pri{background:#222222;color:#FFFFFF}
.pri:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#FFFFFF;color:#222222;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;overflow:hidden">
  <header class="hd">
    <a class="ib" href="Liste-Complete.dc.html" aria-label="Liste complète"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></a>
    <h1 style="margin:0;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">[Magasin 1] · 4 / 9</h1>
    <a class="pause" href="Courses-Interrompre.dc.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>Pause</a>
  </header>
  <nav class="strip" aria-label="Secteurs dans l'ordre du parcours">
    <button type="button" class="chip done">1 Fruits ✓</button>
    <button type="button" class="chip done">2 Conserves ✓</button>
    <button type="button" class="chip sel">3 Crèmerie</button>
    <button type="button" class="chip">4 Charcuterie</button>
    <button type="button" class="chip">5 Papier</button>
    <button type="button" class="chip" style="border-style:dashed">? Non placé</button>
  </nav>
  <div style="display:flex;justify-content:space-between;padding:6px 8px;font-size:13px;border-bottom:1px solid #CCCCCC;background:#F7F7F7"><span><b>Crèmerie</b> · rayon Frais</span><span>1 / 3 coché</span></div>
  <main style="flex:1;overflow-y:auto">
    <label class="row"><input type="checkbox"/><span class="nm"><b>Lait demi-écrémé</b><br/><span class="s">[Marque A] · pack de 6 · 3 achetés = 1 offert</span></span><span class="pi">LOT</span><span class="q">×3</span></label>
    <label class="row"><input type="checkbox"/><span class="nm"><b>Fromage râpé</b><br/><span class="s">200 g</span></span><span class="q">×1</span></label>
    <label class="row" style="color:#777777"><input type="checkbox" defaultChecked="{{ true }}"/><span class="nm" style="text-decoration:line-through">Yaourts nature<br/><span class="s">pack de 12</span></span><span class="q">×1</span></label>
  </main>
  <div style="padding:8px;border-top:2px solid #222222;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
    <a class="btn" href="#">◀ Conserves</a>
    <a class="btn pri" href="#">Charcuterie ▶</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
