<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Promotion visée</title>

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#222222}a:hover{color:#000000}
.hd{height:48px;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:2px solid #222222}
.row{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid #DDDDDD;padding:0 8px;font-size:15px}
.box{width:22px;height:22px;border:2px solid #222222;border-radius:4px;flex:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-top:2px solid #222222;border-radius:16px 16px 0 0;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#555555;margin-top:4px}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.typ{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;border:2px solid #222222;border-radius:8px;background:#FFFFFF;font-family:inherit;font-size:12px;color:#222222}
.typ.sel{background:#222222;color:#FFFFFF;font-weight:700}
.pi{min-width:28px;height:20px;padding:0 3px;border:1.5px solid currentColor;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#555555;flex:1}
.inp{height:44px;border:2px solid #222222;border-radius:8px;padding:0 10px;font-family:inherit;font-size:15px;background:#FFFFFF;color:#222222;width:100%}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 12px;border:2px solid #222222;border-radius:8px;font-weight:700;text-decoration:none;background:#FFFFFF;color:#222222;font-size:15px}
.pri{background:#222222;color:#FFFFFF}
.pri:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;background:#FFFFFF;color:#222222;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;overflow:hidden">
  <div aria-hidden="true">
    <div class="hd"><span style="width:44px"></span><b style="font-size:17px">Préparer · [Magasin 1]</b></div>
    <div style="height:88px;border-bottom:1px solid #CCCCCC;background:#F7F7F7"></div>
    <div class="row" style="background:#F2F2F2"><span class="box" style="background:#222222"></span><b>Lait demi-écrémé</b></div>
    <div class="row" style="background:#F2F2F2"><span class="box" style="background:#222222"></span><b>Yaourts nature</b></div>
    <div class="row" style="background:#F2F2F2"><span class="box" style="background:#222222"></span><b>Fromage râpé</b></div>
    <div class="row"><span class="box"></span>Beurre doux</div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45)"></div>
  <section class="sheet" aria-label="Promotion visée">
    <div style="width:40px;height:4px;border-radius:2px;background:#888888;align-self:center"></div>
    <div>
      <div style="font-size:18px;font-weight:700">Promotion visée</div>
      <div style="font-size:13px;color:#555555">Lait demi-écrémé · pack de 6 · [Magasin 1] — d'après le catalogue du magasin</div>
    </div>
    <div class="lbl">Type</div>
    <div class="types" role="group" aria-label="Type de promotion">
      <button type="button" class="typ sel"><span class="pi">LOT</span>Lot</button>
      <button type="button" class="typ"><span class="pi">2=€</span>Prix global</button>
      <button type="button" class="typ"><span class="pi">−%</span>Remise</button>
      <button type="button" class="typ"><span class="pi">PK</span>Packaging</button>
      <button type="button" class="typ"><span class="pi">FID</span>Fidélité</button>
      <button type="button" class="typ"><span class="pi">?</span>Autre</button>
    </div>
    <div style="display:flex;gap:8px">
      <label class="fld">Achetés<input class="inp" type="number" value="3"/></label>
      <label class="fld">Offerts<input class="inp" type="number" value="1"/></label>
    </div>
    <label class="fld">Libellé<input class="inp" type="text" value="3 achetés = 1 offert"/></label>
    <div style="display:flex;gap:8px;margin-top:4px">
      <a class="btn" href="Construire.dc.html" style="flex:1">Sans promotion</a>
      <a class="btn pri" href="Construire.dc.html" style="flex:1">Valider</a>
    </div>
  </section>
</div>
