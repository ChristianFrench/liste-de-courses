name: Essai de synchronisation

# Petite application indépendante (dossier essai_synchro/) : compilée seule, sans l'application principale.
on:
  push:
    paths: ['essai_synchro/**', '.github/workflows/essai-synchro.yml']
  workflow_dispatch:

env:
  CREER: flutter create --org fr.listecourses --project-name essai_synchro --platforms android,windows .

defaults:
  run:
    working-directory: essai_synchro
    shell: bash

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Analyser et tester
        run: |
          $CREER > /dev/null
          flutter pub get
          set +e
          flutter analyze > analyse.log 2>&1; a=$?
          flutter test > tests.log 2>&1; t=$?
          [ $a -ne 0 ] && python3 ../outils/annoter.py analyse.log "Analyse essai synchro"
          [ $t -ne 0 ] && python3 ../outils/annoter.py tests.log "Tests essai synchro"
          [ $a -eq 0 ] && [ $t -eq 0 ]
      - name: Deux appareils sur le vrai serveur MQTT (broker.hivemq.com)
        continue-on-error: true
        run: |
          flutter test test/serveur_reel.dart --reporter expanded > reel.log 2>&1
          grep -o '::\(notice\|warning\) title=.*' reel.log || true
          grep -q 'All tests passed' reel.log || { echo "::warning title=Serveur réel::échec"; tail -n 30 reel.log; exit 1; }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Préparer le projet
        run: |
          $CREER
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#; s#android:label="essai_synchro"#android:label="Essai synchro"#' $M
          grep -n 'INTERNET\|label' $M
      - name: Compiler l'APK
        run: |
          set +e
          flutter build apk --release --dart-define=VERSION="${GITHUB_SHA::7}" > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 ../outils/annoter.py compilation.log "Compilation Android essai synchro"; else tail -n 5 compilation.log; fi
          exit $code
      - run: mv build/app/outputs/flutter-apk/app-release.apk ../Essai-synchro.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Essai-synchro.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Compiler l'exécutable Windows
        run: |
          $CREER
          set +e
          flutter build windows --release --dart-define=VERSION="${GITHUB_SHA::7}" > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python ../outils/annoter.py compilation.log "Compilation Windows essai synchro"; else tail -n 5 compilation.log; fi
          exit $code
      - name: Joindre les bibliothèques Visual C++
        shell: pwsh
        run: |
          $dest = "build/windows/x64/runner/Release"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") { Copy-Item "C:\Windows\System32\$f" $dest }
          Rename-Item "$dest/essai_synchro.exe" "Essai synchro.exe"
          Compress-Archive -Path "$dest/*" -DestinationPath ../Essai-synchro-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Essai-synchro-Windows.zip }

  publication:
    needs: [verification, android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: livrables, merge-multiple: true }
      - name: Publier sur la page « essai-synchro »
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete essai-synchro --yes --cleanup-tag 2>/dev/null || true
          git push -q origin :refs/tags/essai-synchro 2>/dev/null || true
          gh release create essai-synchro livrables/* --target "$GITHUB_SHA" --prerelease \
            --title "Essai de synchronisation (${GITHUB_SHA::7})" \
            --notes "Application d'essai : APK pour le téléphone, zip pour le PC Windows. Compilation du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')."
