name: Compilation Android, Windows, web

on:
  push:
  workflow_dispatch:

env:
  # Identifiant du serveur MQTT : secrets saisis par le maître d'ouvrage sur GitHub, jamais dans le dépôt.
  MQTT_UTILISATEUR: ${{ secrets.MQTT_UTILISATEUR }}
  MQTT_MOT_DE_PASSE: ${{ secrets.MQTT_MOT_DE_PASSE }}
  # Code qui ouvre l'éditeur du catalogue commun sur l'appareil du maître d'ouvrage.
  CODE_EDITEUR: ${{ secrets.CODE_EDITEUR }}
  CREER: flutter create --org fr.listecourses --project-name liste_de_courses --platforms android,windows .

jobs:
  verification:
    name: verification (analyse et tests de recette)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Analyser le code
        run: |
          sudo apt-get install -y -qq libsqlite3-dev > /dev/null   # SQLite pour les tests de la base locale
          flutter pub get
          flutter --version
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyse.log 2>&1
          code=$?
          python3 outils/annoter.py analyse.log "Analyse du code" analyse
          exit $code
      - name: Tests de recette de la maquette
        if: always()
        run: |
          set +e
          flutter test --reporter expanded > tests.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 outils/annoter.py tests.log "Tests de recette"; else tail -n 30 tests.log; fi
          exit $code
      - name: Deux appareils sur le vrai serveur MQTT (broker.hivemq.com)
        if: always()
        continue-on-error: true
        run: |
          flutter test test/synchro_serveur_reel.dart --reporter expanded > reel.log 2>&1
          grep -o '::\(notice\|warning\) title=.*' reel.log || true
          grep -q 'All tests passed' reel.log || { echo "::warning title=Synchronisation, serveur réel::échec"; tail -n 30 reel.log; exit 1; }
      - name: Captures des écrans (branche « captures »)
        if: always() && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[rapide]') && !contains(github.event.head_commit.message, '[web]')
        env:
          CAPTURES: '1'
        run: |
          set +e
          flutter test --update-goldens test/captures_test.dart > captures.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 outils/annoter.py captures.log "Captures des écrans"; fi
          ls test/captures || exit 1
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan captures-temp
          git rm -rq --cached .
          git add -f test/captures/*.png test/captures/*.txt 2>/dev/null || git add -f test/captures/*.png
          git commit -qm "Captures des écrans pour ${GITHUB_SHA::7}"
          git push -qf origin HEAD:refs/heads/captures
          exit $code
      - name: Conserver les captures pour la publication
        if: always() && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[rapide]') && !contains(github.event.head_commit.message, '[web]')
        uses: actions/upload-artifact@v4
        with:
          name: Captures
          path: test/captures/
          if-no-files-found: ignore

  android:
    # Mode rapide (« [rapide] » dans le message de commit) : Windows seulement ;
    # mode web (« [web] ») : la version web seulement, la page « derniere-version » garde l'APK et l'exe précédents
    if: "!contains(github.event.head_commit.message, '[rapide]') && !contains(github.event.head_commit.message, '[web]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Préparer le projet
        run: |
          $CREER
          python3 outils/preparer.py
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons
      - name: Compiler l'APK
        run: |
          set +e
          flutter build apk --release --dart-define=VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//') (${GITHUB_SHA::7})" --dart-define=MQTT_UTILISATEUR="$MQTT_UTILISATEUR" --dart-define=MQTT_MOT_DE_PASSE="$MQTT_MOT_DE_PASSE" --dart-define=CODE_EDITEUR="$CODE_EDITEUR" > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 outils/annoter.py compilation.log "Compilation Android"; else tail -n 20 compilation.log; fi
          exit $code
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/Liste de courses.apk"
      - name: APK pour émulateur sur PC (LDPlayer, BlueStacks…), plus léger
        run: |
          flutter build apk --release --dart-define=VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//') (${GITHUB_SHA::7})" --dart-define=MQTT_UTILISATEUR="$MQTT_UTILISATEUR" --dart-define=MQTT_MOT_DE_PASSE="$MQTT_MOT_DE_PASSE" --dart-define=CODE_EDITEUR="$CODE_EDITEUR" --target-platform android-x64
          mv build/app/outputs/flutter-apk/app-release.apk "build/Liste de courses (emulateur PC).apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Liste de courses Android
          path: build/Liste de courses*.apk

  windows:
    if: "!contains(github.event.head_commit.message, '[web]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Préparer le projet
        shell: bash
        run: |
          $CREER
          python outils/preparer.py
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons
      - name: Compiler l'exécutable Windows
        shell: bash
        run: |
          set +e
          flutter build windows --release --dart-define=VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//') (${GITHUB_SHA::7})" --dart-define=MQTT_UTILISATEUR="$MQTT_UTILISATEUR" --dart-define=MQTT_MOT_DE_PASSE="$MQTT_MOT_DE_PASSE" --dart-define=CODE_EDITEUR="$CODE_EDITEUR" > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python outils/annoter.py compilation.log "Compilation Windows"; else tail -n 20 compilation.log; fi
          exit $code
      - name: Joindre les bibliothèques Visual C++
        shell: pwsh
        run: |
          $dest = "build/windows/x64/runner/Release"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$f" $dest
          }
      - name: Mettre de côté l'application
        shell: bash
        run: mv build/windows/x64/runner/Release "build/Liste de courses Windows"
      - uses: actions/upload-artifact@v4
        with:
          name: Liste de courses Windows
          path: build/Liste de courses Windows/

  web:
    # Version web (navigateur), publiée sur GitHub Pages avec la page de présentation (docs/)
    if: "!contains(github.event.head_commit.message, '[rapide]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Préparer le projet
        run: |
          flutter create --org fr.listecourses --project-name liste_de_courses --platforms web .
          python3 outils/preparer.py
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons -f outils/web/icones.yaml
          # sqlite3 compilé en WebAssembly, de la même version que le paquet Dart
          V=$(python3 -c "import re; print(re.search(r'\n  sqlite3:\n(?:    .*\n)*?    version: \"([^\"]+)\"', open('pubspec.lock').read())[1])")
          curl -fsSL -o web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-$V/sqlite3.wasm"
          # Démarrage sans le service worker de Flutter (remplacé par hors_ligne.js)
          cp outils/web/flutter_bootstrap.js web/
      - name: Compiler la version web
        run: |
          set +e
          flutter build web --release --no-web-resources-cdn --base-href /liste-de-courses/web/ --dart-define=VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//') (${GITHUB_SHA::7})" --dart-define=MQTT_UTILISATEUR="$MQTT_UTILISATEUR" --dart-define=MQTT_MOT_DE_PASSE="$MQTT_MOT_DE_PASSE" --dart-define=CODE_EDITEUR="$CODE_EDITEUR" > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 outils/annoter.py compilation.log "Compilation web"; else tail -n 20 compilation.log; fi
          exit $code
      - name: Ouverture sans réseau (service worker hors_ligne.js)
        run: python3 outils/web/hors_ligne.py build/web
      - name: Assembler le site (page de présentation + application)
        run: |
          mkdir site
          cp -r docs/. site/
          cp -r build/web site/web
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  site_web:
    name: publication de la version web (GitHub Pages)
    needs: web
    if: github.ref == 'refs/heads/main'
    concurrency: site_web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}web/
    steps:
      - name: Publier le site par GitHub Actions (au lieu du dossier docs/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow || echo "::warning::Réglage Pages à faire à la main : Settings > Pages > Source = GitHub Actions"
      - id: deploiement
        uses: actions/deploy-pages@v4

  publication:
    name: publication (page « derniere-version »)
    needs: [verification, android, windows]
    concurrency: publication
    if: always() && github.ref == 'refs/heads/main' && needs.verification.result == 'success' && needs.windows.result == 'success' && needs.android.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: livrables }
      - name: Préparer les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p publication
          # Mode rapide : l'APK et les captures de la version précédente sont repris tels quels
          gh release download derniere-version -p Liste-de-courses.apk -p Liste-de-courses-emulateur-PC.apk -p Captures.zip -D publication 2>/dev/null || true
          if [ -f "livrables/Liste de courses Android/Liste de courses.apk" ]; then cp -f "livrables/Liste de courses Android/Liste de courses.apk" publication/Liste-de-courses.apk; fi
          if [ -f "livrables/Liste de courses Android/Liste de courses (emulateur PC).apk" ]; then cp -f "livrables/Liste de courses Android/Liste de courses (emulateur PC).apk" publication/Liste-de-courses-emulateur-PC.apk; fi
          (cd "livrables/Liste de courses Windows" && zip -qr ../../publication/Liste-de-courses-Windows.zip .)
          if [ -d livrables/Captures ]; then rm -f publication/Captures.zip; (cd livrables/Captures && zip -qr ../../publication/Captures.zip .); fi
          (cd documents && zip -qr ../publication/Documents.zip .)
          {
            echo "version=$VERSION"
            echo "commit=${GITHUB_SHA::7}"
            echo "date=$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          } > publication/version.txt
          cat publication/version.txt
          ls -la publication
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version=' publication/version.txt | cut -d= -f2)
          gh release delete derniere-version --yes --cleanup-tag 2>/dev/null || true
          git push -q origin :refs/tags/derniere-version 2>/dev/null || true
          set +e
          gh release create derniere-version publication/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dernière version — $VERSION (${GITHUB_SHA::7})" \
            --notes "Fichiers récupérés automatiquement par « Mettre a jour.bat ». Version $VERSION, compilation du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')." 2> erreur.txt
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=Publication::$(sed ':a;N;$!ba;s/\n/ | /g' erreur.txt)"; fi
          exit $code
