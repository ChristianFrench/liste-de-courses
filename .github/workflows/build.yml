name: Compilation Android, Windows, iPhone

on:
  push:
    # L'application d'essai de synchronisation a sa propre compilation
    paths-ignore: ['essai_synchro/**', '.github/workflows/essai-synchro.yml']
  workflow_dispatch:

env:
  CREER: flutter create --org fr.listecourses --project-name liste_de_courses --platforms android,ios,windows .

jobs:
  verification:
    name: verification (analyse et tests de recette)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Joindre le catalogue Open Food Facts
        shell: bash
        run: curl -fsSL -o assets/catalogue/catalogue.json.gz https://github.com/ChristianFrench/liste-de-courses/releases/download/catalogue-off/catalogue.json.gz || echo "::warning::catalogue absent, application livrée sans catalogue"
      - name: Analyser le code
        run: |
          sudo apt-get install -y -qq libsqlite3-dev > /dev/null   # SQLite pour les tests de la base locale
          flutter pub get
          flutter --version
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyse.log 2>&1
          code=$?
          python3 outils/annoter.py analyse.log "Analyse du code" analyse
          exit $code
      - name: Tests de recette de la maquette
        if: always()
        run: |
          set +e
          flutter test --reporter expanded > tests.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 outils/annoter.py tests.log "Tests de recette"; else tail -n 30 tests.log; fi
          exit $code
      - name: Deux appareils sur le vrai serveur MQTT (broker.hivemq.com)
        if: always()
        continue-on-error: true
        run: |
          flutter test test/synchro_serveur_reel.dart --reporter expanded > reel.log 2>&1
          grep -o '::\(notice\|warning\) title=.*' reel.log || true
          grep -q 'All tests passed' reel.log || { echo "::warning title=Synchronisation, serveur réel::échec"; tail -n 30 reel.log; exit 1; }
      - name: Captures des écrans (branche « captures »)
        if: always() && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[rapide]')
        env:
          CAPTURES: '1'
        run: |
          set +e
          flutter test --update-goldens test/captures_test.dart > captures.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 outils/annoter.py captures.log "Captures des écrans"; fi
          # Écran d'essai Open Food Facts avec de vraies données : un échec ne bloque pas
          flutter test --update-goldens test/captures_off_test.dart > captures_off.log 2>&1 \
            || { echo "::warning title=Captures Open Food Facts::échec, détail ci-dessous"; python3 outils/annoter.py captures_off.log "Captures Open Food Facts" | grep '^::' | sed 's/^::error/::warning/'; }
          ls test/captures || exit 1
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan captures-temp
          git rm -rq --cached .
          git add -f test/captures/*.png test/captures/*.txt 2>/dev/null || git add -f test/captures/*.png
          git commit -qm "Captures des écrans pour ${GITHUB_SHA::7}"
          git push -qf origin HEAD:refs/heads/captures
          exit $code
      - name: Conserver les captures pour la publication
        if: always() && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[rapide]')
        uses: actions/upload-artifact@v4
        with:
          name: Captures
          path: test/captures/
          if-no-files-found: ignore

  android:
    # Mode rapide (« [rapide] » dans le message de commit) : Windows seulement
    if: "!contains(github.event.head_commit.message, '[rapide]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Joindre le catalogue Open Food Facts
        shell: bash
        run: curl -fsSL -o assets/catalogue/catalogue.json.gz https://github.com/ChristianFrench/liste-de-courses/releases/download/catalogue-off/catalogue.json.gz || echo "::warning::catalogue absent, application livrée sans catalogue"
      - name: Préparer le projet
        run: |
          $CREER
          python3 outils/preparer.py
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons
      - name: Compiler l'APK
        run: |
          set +e
          flutter build apk --release --dart-define=VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//') (${GITHUB_SHA::7})" > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 outils/annoter.py compilation.log "Compilation Android"; else tail -n 20 compilation.log; fi
          exit $code
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/Liste de courses.apk"
      - name: APK pour émulateur sur PC (LDPlayer, BlueStacks…), plus léger
        run: |
          flutter build apk --release --dart-define=VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//') (${GITHUB_SHA::7})" --target-platform android-x64
          mv build/app/outputs/flutter-apk/app-release.apk "build/Liste de courses (emulateur PC).apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Liste de courses Android
          path: build/Liste de courses*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Joindre le catalogue Open Food Facts
        shell: bash
        run: curl -fsSL -o assets/catalogue/catalogue.json.gz https://github.com/ChristianFrench/liste-de-courses/releases/download/catalogue-off/catalogue.json.gz || echo "::warning::catalogue absent, application livrée sans catalogue"
      - name: Préparer le projet
        shell: bash
        run: |
          $CREER
          python outils/preparer.py
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons
      - name: Compiler l'exécutable Windows
        shell: bash
        run: |
          set +e
          flutter build windows --release --dart-define=VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//') (${GITHUB_SHA::7})" > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python outils/annoter.py compilation.log "Compilation Windows"; else tail -n 20 compilation.log; fi
          exit $code
      - name: Joindre les bibliothèques Visual C++
        shell: pwsh
        run: |
          $dest = "build/windows/x64/runner/Release"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$f" $dest
          }
      - name: Mettre de côté l'application
        shell: bash
        run: mv build/windows/x64/runner/Release "build/Liste de courses Windows"
      - name: Compiler « Gestion du catalogue »
        shell: bash
        run: |
          set +e
          flutter build windows --release -t lib/gestion_catalogue.dart > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python outils/annoter.py compilation.log "Compilation Gestion du catalogue"; else tail -n 5 compilation.log; fi
          exit $code
      - name: Préparer « Gestion du catalogue »
        shell: pwsh
        run: |
          $dest = "build/Gestion du catalogue"
          Move-Item build/windows/x64/runner/Release $dest
          Rename-Item "$dest/liste_de_courses.exe" "Gestion du catalogue.exe"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$f" $dest
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Liste de courses Windows
          path: build/Liste de courses Windows/
      - uses: actions/upload-artifact@v4
        with:
          name: Gestion du catalogue Windows
          path: build/Gestion du catalogue/

  serveur_mqtt:
    name: serveur MQTT Windows (Mosquitto installé et vérifié)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Compiler Verifier-serveur-MQTT.exe
        shell: bash
        run: |
          flutter pub get > /dev/null
          mkdir -p "build/Serveur MQTT"
          dart compile exe outils/verifier_serveur_mqtt.dart -o "build/Serveur MQTT/Verifier-serveur-MQTT.exe"
          cp "outils/mosquitto/Installer le serveur MQTT.bat" outils/mosquitto/LISEZMOI.txt "build/Serveur MQTT/"
      - uses: actions/upload-artifact@v4
        with:
          name: Serveur MQTT Windows
          path: build/Serveur MQTT/
      - name: Essai du .bat sur ce Windows (installation, service, vérification)
        shell: cmd
        run: |
          xcopy /e /i /q "build\Serveur MQTT" "%RUNNER_TEMP%\essai" > nul
          call "%RUNNER_TEMP%\essai\Installer le serveur MQTT.bat" courses Essai123 1883 > "%RUNNER_TEMP%\essai.log" 2>&1
          set code=%errorlevel%
          type "%RUNNER_TEMP%\essai.log"
          python outils\annoter_mqtt.py "%RUNNER_TEMP%\essai.log"
          exit /b %code%
      - name: Essai du .bat avec les questions (comme un double-clic, mot de passe laissé vide)
        shell: cmd
        run: |
          rem Les réponses sont lues dans un fichier, ligne par ligne, comme au clavier
          rem D'abord un mot de passe refusé (avec &), qui doit être redemandé, puis vide (tiré au hasard)
          > "%RUNNER_TEMP%\reponses.txt" echo courses
          >> "%RUNNER_TEMP%\reponses.txt" echo courses06^&
          >> "%RUNNER_TEMP%\reponses.txt" echo.
          >> "%RUNNER_TEMP%\reponses.txt" echo 1883
          >> "%RUNNER_TEMP%\reponses.txt" echo n
          >> "%RUNNER_TEMP%\reponses.txt" echo.
          >> "%RUNNER_TEMP%\reponses.txt" echo.
          call "%RUNNER_TEMP%\essai\Installer le serveur MQTT.bat" < "%RUNNER_TEMP%\reponses.txt" > "%RUNNER_TEMP%\essai2.log" 2>&1
          set code=%errorlevel%
          type "%RUNNER_TEMP%\essai2.log"
          python outils\annoter_mqtt.py "%RUNNER_TEMP%\essai2.log"
          findstr /c:"Serveur MQTT pret" "%RUNNER_TEMP%\essai2.log" > nul || exit /b 1
          findstr /c:"Mot de passe refuse" "%RUNNER_TEMP%\essai2.log" > nul || exit /b 1
          exit /b %code%

  iphone:
    if: "!contains(github.event.head_commit.message, '[rapide]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Joindre le catalogue Open Food Facts
        shell: bash
        run: curl -fsSL -o assets/catalogue/catalogue.json.gz https://github.com/ChristianFrench/liste-de-courses/releases/download/catalogue-off/catalogue.json.gz || echo "::warning::catalogue absent, application livrée sans catalogue"
      - name: Préparer le projet
        run: |
          $CREER
          python3 outils/preparer.py
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons
      - name: Compiler la version iPhone (vérification, sans signature)
        run: |
          set +e
          flutter build ios --release --dart-define=VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//') (${GITHUB_SHA::7})" --no-codesign > compilation.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then python3 outils/annoter.py compilation.log "Compilation iPhone"; else tail -n 20 compilation.log; fi
          exit $code

  publication:
    name: publication (page « derniere-version »)
    needs: [verification, android, windows, serveur_mqtt]
    concurrency: publication
    if: always() && github.ref == 'refs/heads/main' && needs.verification.result == 'success' && needs.windows.result == 'success' && needs.android.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: livrables }
      - name: Préparer les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p publication
          # Mode rapide : l'APK et les captures de la version précédente sont repris tels quels
          gh release download derniere-version -p Liste-de-courses.apk -p Liste-de-courses-emulateur-PC.apk -p Captures.zip -D publication 2>/dev/null || true
          if [ -f "livrables/Liste de courses Android/Liste de courses.apk" ]; then cp -f "livrables/Liste de courses Android/Liste de courses.apk" publication/Liste-de-courses.apk; fi
          if [ -f "livrables/Liste de courses Android/Liste de courses (emulateur PC).apk" ]; then cp -f "livrables/Liste de courses Android/Liste de courses (emulateur PC).apk" publication/Liste-de-courses-emulateur-PC.apk; fi
          (cd "livrables/Liste de courses Windows" && zip -qr ../../publication/Liste-de-courses-Windows.zip .)
          if [ -d "livrables/Serveur MQTT Windows" ]; then (cd "livrables/Serveur MQTT Windows" && zip -qr ../../publication/Serveur-MQTT-Windows.zip .); fi
          if [ -d "livrables/Gestion du catalogue Windows" ]; then (cd "livrables/Gestion du catalogue Windows" && zip -qr ../../publication/Gestion-du-catalogue-Windows.zip .); fi
          if [ -d livrables/Captures ]; then rm -f publication/Captures.zip; (cd livrables/Captures && zip -qr ../../publication/Captures.zip .); fi
          (cd documents && zip -qr ../publication/Documents.zip .)
          {
            echo "version=$VERSION"
            echo "commit=${GITHUB_SHA::7}"
            echo "date=$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          } > publication/version.txt
          cat publication/version.txt
          ls -la publication
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version=' publication/version.txt | cut -d= -f2)
          gh release delete derniere-version --yes --cleanup-tag 2>/dev/null || true
          git push -q origin :refs/tags/derniere-version 2>/dev/null || true
          set +e
          gh release create derniere-version publication/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dernière version — $VERSION (${GITHUB_SHA::7})" \
            --notes "Fichiers récupérés automatiquement par « Mettre a jour.bat ». Version $VERSION, compilation du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')." 2> erreur.txt
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=Publication::$(sed ':a;N;$!ba;s/\n/ | /g' erreur.txt)"; fi
          exit $code
