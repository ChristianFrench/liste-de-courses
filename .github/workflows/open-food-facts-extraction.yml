name: Open Food Facts - extraction

# Marques et popularité de chaque nature du catalogue, tirées de l'export complet d'Open Food Facts
# (outils/off/extraire.py) ; le résultat est déposé dans le dépôt (outils/off/natures_off.json).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Extraire
        run: python3 outils/off/extraire.py
      - name: Déposer le résultat
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add outils/off/natures_off.json
          git commit -m "Open Food Facts : marques et popularité par nature [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
