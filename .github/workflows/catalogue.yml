name: Catalogue Open Food Facts

# Extrait des produits vendus en France, publié sur la page « catalogue-off » :
#   catalogue.json.gz      base, reconstruite le 1er de chaque mois
#   catalogue-maj.json.gz  mise à jour cumulative depuis la base, recalculée chaque nuit
#   catalogue-version.txt  versions, lu par l'application pour savoir quoi télécharger
on:
  workflow_dispatch:
    inputs:
      travail:
        description: 'base (extrait complet) ou cumul (mise à jour)'
        default: 'cumul'
  schedule:
    - cron: '17 3 1 * *'      # base : le 1er du mois, 3 h 17 UTC
    - cron: '47 4 * * *'      # cumul : chaque nuit, 4 h 47 UTC
  push:
    branches: [main]
    paths: ['outils/catalogue_off.py', '.github/workflows/catalogue.yml']

concurrency: catalogue

env:
  UA: "ListeDeCourses (github.com/ChristianFrench/liste-de-courses)"
  PAGE: https://github.com/ChristianFrench/liste-de-courses/releases/download/catalogue-off

jobs:
  base:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 3 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.travail == 'base') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger l'export Open Food Facts et la taxonomie
        run: |
          curl -fsSL -A "$UA" -o export.csv.gz https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
          curl -fsSL -A "$UA" -o categories.json https://static.openfoodfacts.org/data/taxonomies/categories.json
          curl -fsSL -o categories.txt https://raw.githubusercontent.com/openfoodfacts/openfoodfacts-server/main/taxonomies/food/categories.txt
          ls -la export.csv.gz categories.json categories.txt
      - name: Construire la base
        run: python3 outils/catalogue_off.py base export.csv.gz categories.json categories.txt catalogue.json.gz | tee base.log
      - name: Publier (la mise à jour cumulative repart de zéro)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 outils/catalogue_off.py cumul catalogue.json.gz - vide catalogue-maj.json.gz
          python3 outils/version_catalogue.py catalogue.json.gz catalogue-maj.json.gz > catalogue-version.txt
          cat catalogue-version.txt
          gh release delete catalogue-off --yes --cleanup-tag 2>/dev/null || true
          git push -q origin :refs/tags/catalogue-off 2>/dev/null || true
          gh release create catalogue-off catalogue.json.gz catalogue-maj.json.gz catalogue-version.txt base.log \
            --target "$GITHUB_SHA" --prerelease \
            --title "Catalogue Open Food Facts" \
            --notes "Extrait des produits vendus en France utilisé par l'application (base mensuelle et mise à jour cumulative quotidienne). Données Open Food Facts (ODbL), photos CC BY-SA."

  cumul:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 4 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.travail != 'base')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer la base et la dernière mise à jour
        run: |
          curl -fsSL -o catalogue.json.gz "$PAGE/catalogue.json.gz"
          curl -fsSL -o ancien.json.gz "$PAGE/catalogue-maj.json.gz" || echo "pas de mise à jour précédente"
      - name: Télécharger les changements quotidiens d'Open Food Facts
        run: |
          DEPUIS=$(python3 -c "
          import gzip,json,os
          b=json.load(gzip.open('catalogue.json.gz','rt'))
          j=b['jusqua']
          if os.path.exists('ancien.json.gz'):
              a=json.load(gzip.open('ancien.json.gz','rt'))
              if a.get('base')==b['version']: j=max(j,a['jusqua'])
          print(j)")
          echo "changements après : $(date -u -d @$DEPUIS '+%d/%m/%Y %H:%M') UTC"
          mkdir -p deltas
          curl -fsSL -A "$UA" https://static.openfoodfacts.org/data/delta/index.txt > index.txt
          cat index.txt
          for f in $(cat index.txt); do
            FIN=$(echo "$f" | grep -oE '[0-9]{9,11}' | tail -1)
            if [ -n "$FIN" ] && [ "$FIN" -gt "$DEPUIS" ]; then
              echo "téléchargement : $f"
              curl -fsSL -A "$UA" -o "deltas/$f" "https://static.openfoodfacts.org/data/delta/$f"
            fi
          done
          ls -la deltas
      - name: Calculer la mise à jour cumulative
        run: |
          curl -fsSL -A "$UA" -o categories.json https://static.openfoodfacts.org/data/taxonomies/categories.json
          curl -fsSL -o categories.txt https://raw.githubusercontent.com/openfoodfacts/openfoodfacts-server/main/taxonomies/food/categories.txt
          ANCIEN=ancien.json.gz; [ -f "$ANCIEN" ] || ANCIEN=-
          python3 outils/catalogue_off.py cumul catalogue.json.gz "$ANCIEN" deltas catalogue-maj.json.gz categories.json categories.txt | tee cumul.log
          python3 outils/version_catalogue.py catalogue.json.gz catalogue-maj.json.gz > catalogue-version.txt
          cat catalogue-version.txt
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload catalogue-off catalogue-maj.json.gz catalogue-version.txt cumul.log --clobber
