# Vérification rapide d'« Emplettes · catalogues » (C# WinForms) : compilation seule, à chaque modification de
# windows-catalogues/ (l'installateur est fait par le job windows de build.yml).
name: Vérification Emplettes catalogues
on:
  push:
    paths:
      - 'windows-catalogues/**'
  workflow_dispatch:
jobs:
  compiler:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compiler
        shell: pwsh
        run: |
          dotnet build windows-catalogues/EmplettesCatalogues.csproj -c Release -warnaserror:nullable- 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error ' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
