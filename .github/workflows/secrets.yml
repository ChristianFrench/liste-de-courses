name: Vérifier les secrets

# Dit si les secrets sont définis et leur longueur, sans jamais afficher leur valeur.
on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets reçus par la compilation
        env:
          MQTT_UTILISATEUR: ${{ secrets.MQTT_UTILISATEUR }}
          MQTT_MOT_DE_PASSE: ${{ secrets.MQTT_MOT_DE_PASSE }}
          CODE_EDITEUR: ${{ secrets.CODE_EDITEUR }}
        run: |
          for n in MQTT_UTILISATEUR MQTT_MOT_DE_PASSE CODE_EDITEUR; do
            v="${!n}"
            t="$(printf '%s' "$v" | tr -d '[:space:]')"
            echo "::notice title=$n::${#v} caractères, dont $(( ${#v} - ${#t} )) espaces ou retours à la ligne"
          done
