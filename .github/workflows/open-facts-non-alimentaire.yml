name: Open Facts non alimentaire - extraction

# Marques et popularité des natures non alimentaires du catalogue, tirées des exports d'Open Beauty Facts,
# Open Products Facts et Open Pet Food Facts (outils/off/extraire.py avec BASE=obf, opf, opff) ;
# résultats déposés dans outils/off/natures_<base>.json et candidats_<base>.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Open Beauty Facts
        run: BASE=obf python3 outils/off/extraire.py
      - name: Open Products Facts
        run: BASE=opf python3 outils/off/extraire.py
      - name: Open Pet Food Facts
        run: BASE=opff python3 outils/off/extraire.py
      - name: Déposer le résultat
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add outils/off/natures_obf.json outils/off/natures_opf.json outils/off/natures_opff.json outils/off/candidats_obf.json outils/off/candidats_opf.json outils/off/candidats_opff.json
          git commit -m "Open Beauty, Products et Pet Food Facts : marques et popularité par nature [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
