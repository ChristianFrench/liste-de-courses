# APK « Mémo Emplettes » (19/11/2026, Aristide) : composants et liens d'Emplettes, avec un widget d'écran
# d'accueil personnalisable. Déposée dans telechargements/essai/Memo-Emplettes.apk (et sur « derniere-version »).
name: Mémo Emplettes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['outils/memo/**', '.github/workflows/memo.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Compiler l'APK
        working-directory: outils/memo
        run: |
          flutter create --org fr.listecourses --project-name memo_emplettes --platforms android .
          python3 android_ajouts/preparer.py
          grep -n "MemoWidget\|label" android/app/src/main/AndroidManifest.xml
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk ../../Memo-Emplettes.apk
          ls -l ../../Memo-Emplettes.apk
      - name: Publier sur « derniere-version »
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload derniere-version Memo-Emplettes.apk --clobber
      - name: Déposer sur le serveur (telechargements/essai/)
        env:
          VPS_HOTE: ${{ secrets.VPS_HOTE }}
          VPS_CLE_DEPLOIEMENT: ${{ secrets.VPS_CLE_DEPLOIEMENT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_CLE_DEPLOIEMENT" > ~/.ssh/deploiement && chmod 600 ~/.ssh/deploiement
          mkdir -p depot/telechargements/essai && cp Memo-Emplettes.apk depot/telechargements/essai/
          rsync -rlz -e "ssh -i $HOME/.ssh/deploiement -o StrictHostKeyChecking=accept-new" depot/ "deploiement@$VPS_HOTE:"
          rm -f ~/.ssh/deploiement
